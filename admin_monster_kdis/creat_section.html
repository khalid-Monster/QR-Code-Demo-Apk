<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء صنف</title>
</head>
<body>
    
    <div class="content">

        <h2>إضافة صنف</h2>
        
        <form id="creatSection">
            <div class="data">
                <input type="text" id="name" placeholder="اسم الصنف">
                <i style="color: green;" class="fa fa-cutlery"></i>
            </div>
            <div class="data">
                <label for="image">صورة الصنف</label>
                <input style="opacity: 0;" type="file" id="image" accept="image/*" required>
                <i style="color: orangered;" class="fa fa-star"></i>
            </div>
            <div class="info"><span>ملاحظة يجب ان يكون حجم الصروة صغير اقل من 2 ميقا و ان تكون ذات عرض</span><span>16:9</span></div>

            <div class="allerror"></div>

            <button type="submit" id="signup"> إضافة الصنف </button>
        </form>

    </div>

    <div class="loader-container">
        <div class="loader"></div>
        <p class="loading-text">...جاري التحميل</p>
    </div>

        <a href="home.html"><i class="fa fa-home"></i></a>
    </div>
